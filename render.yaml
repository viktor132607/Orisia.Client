services:
  - type: web
    runtime: static
    name: Orisia.Client
    repo: https://github.com/viktor132607/Orisia.Client.git
    branch: main
    region: frankfurt
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NEXT_PUBLIC_SITE_URL
        value: https://orisia-client-zgwt.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://orisia-server.onrender.com/api
