name: Assemble ORISIA logo

on:
  push:
    paths:
      - ".github/workflows/assemble-orisia-logo.yml"

permissions:
  contents: write

jobs:
  assemble-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble exact uploaded logo
        shell: bash
        run: |
          set -euo pipefail
          cat logo_parts/part*.txt | tr -d '\r\n' | base64 -d > public/orisia-logo.jpg
          test -s public/orisia-logo.jpg
          file public/orisia-logo.jpg | grep -qi 'JPEG image data'
          rm -rf logo_parts
          rm -f .github/workflows/assemble-orisia-logo.yml

      - name: Commit exact logo file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add exact uploaded ORISIA logo JPG"
          git push
